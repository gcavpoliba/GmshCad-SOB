name: Python core validation

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile package
        run: python -m compileall -q gcs tests
      - name: Run geotechnical/core tests
        run: python -m pytest -q tests/test_geotechnical_flow.py tests/test_opensees_registry.py
